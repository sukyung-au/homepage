<!-- @dsCard group="Spacing" viewport="700x200" name="Elevation" subtitle="Flat, hairline, frosted blur, and the one product shadow" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-text)}.sw{display:flex;gap:12px}.s{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.c{height:72px;border-radius:8px}.n{font-size:12px;font-weight:600;letter-spacing:-0.12px}.v{font-size:11px;color:#7a7a7a;font-family:ui-monospace,Menlo,monospace}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;background:var(--color-canvas-parchment);margin:-24px;padding:32px 24px"><div style="display:flex;flex-direction:column;gap:8px"><div style="height:96px;background:#fff"></div><div class="n">Flat</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:96px;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:18px"></div><div class="n">Hairline</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:96px;background:rgba(245,245,247,.8);backdrop-filter:saturate(180%) blur(20px);border:1px solid rgba(0,0,0,.08)"></div><div class="n">Frosted</div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:96px;background:#fff;box-shadow:rgba(0,0,0,.22) 3px 5px 30px 0;border-radius:8px"></div><div class="n">Product shadow</div></div></div></body></html>
